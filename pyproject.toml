[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-tools"
version = "0.2.0"
description = "Mercury Tools: MCP server and Supabase-backed RAG for accounting agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Mercury Agent" }]
dependencies = [
  "httpx==0.28.1",
  "mcp==1.26.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "starlette==1.3.1",
  "uvicorn==0.50.0",
]

[project.optional-dependencies]
openai = ["openai==2.44.0"]
dev = [
  "mcp[cli]==1.26.0",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
mercury = "mercury_tools.cli:main"
mercury-tools = "mercury_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mercury_tools.catalog" = ["global/*/semantic-contracts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires live Supabase/OpenAI credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
