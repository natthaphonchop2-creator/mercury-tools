[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-tools"
version = "0.1.0"
description = "Mercury Tools: MCP server and Supabase-backed RAG for accounting agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Mercury Agent" }]
dependencies = [
  "httpx>=0.28,<1",
  "mcp==1.26.0",
  "openai>=2.24,<3",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6.0,<7",
  "starlette>=1.3,<2",
  "uvicorn>=0.50,<1",
]

[project.optional-dependencies]
dev = [
  "mcp[cli]==1.26.0",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
mercury-tools = "mercury_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires live Supabase/OpenAI credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
