name: Post-public verification

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: v0.2.1
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: true
      - name: Verify anonymous clone, assets, plugin, MCP, and quickstart
        run: |
          set -euo pipefail
          uv sync --extra dev --frozen
          uv run python scripts/verify_public_release.py \
            --repo natthaphonchop2-creator/mercury-tools \
            --tag v0.2.1 --release v0.2.1 --expected-tools 19
