name: Release v0.3.0

on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Reviewed commit currently at origin/main before final tag publication
        required: true
        type: string
      release_control_commit:
        description: Exact trusted release-control v2 commit
        required: true
        type: string
      release_control_run_id:
        description: Exact trusted release-control workflow run ID
        required: true
        type: string
      release_control_run_attempt:
        description: Exact trusted release-control producer run attempt
        required: true
        type: string
      release_control_attestation_artifact_id:
        description: Exact trusted release-control artifact ID
        required: true
        type: string
      release_control_attestation_artifact_digest:
        description: Exact trusted release-control artifact SHA-256 digest
        required: true
        type: string
      release_control_attestation_payload_sha256:
        description: SHA-256 of trusted-hosted-attestation.json
        required: true
        type: string
      release_control_repository_id:
        description: Numeric GitHub repository ID for the trusted release-control repository
        required: true
        type: string
      release_control_attestation_b64:
        description: Base64-encoded sanitized trusted-hosted-attestation.json
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_CONTROL_PIN: eb73f0b0bf5754e29fec336958ed338985ea84e8
  RELEASE_CONTROL_REPOSITORY: natthaphonchop2-creator/mercury-release-control-v2
  RELEASE_TAG: v0.3.0
  RELEASE_VERSION: 0.3.0
  UV_HTTP_TIMEOUT: "120"

jobs:
  validate-reviewed-sha:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
      RELEASE_CONTROL_COMMIT: ${{ inputs.release_control_commit }}
      RELEASE_CONTROL_RUN_ID: ${{ inputs.release_control_run_id }}
      RELEASE_CONTROL_RUN_ATTEMPT: ${{ inputs.release_control_run_attempt }}
      RELEASE_CONTROL_ARTIFACT_ID: ${{ inputs.release_control_attestation_artifact_id }}
      RELEASE_CONTROL_ARTIFACT_DIGEST: ${{ inputs.release_control_attestation_artifact_digest }}
      RELEASE_CONTROL_PAYLOAD_SHA256: ${{ inputs.release_control_attestation_payload_sha256 }}
      RELEASE_CONTROL_REPOSITORY_ID: ${{ inputs.release_control_repository_id }}
    steps:
      - name: Checkout reviewed commit with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind reviewed main and immutable annotated tag
        run: |
          set -euo pipefail
          [[ "$REVIEWED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_CONTROL_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_CONTROL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_CONTROL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_CONTROL_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_CONTROL_PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_CONTROL_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_CONTROL_PIN" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_CONTROL_PIN" != "0000000000000000000000000000000000000000"
          test "$RELEASE_CONTROL_COMMIT" = "$RELEASE_CONTROL_PIN"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REVIEWED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$REVIEWED_MAIN_SHA"
          TAG_OBJECT="$(git ls-remote origin "refs/tags/$RELEASE_TAG" \
            | awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref {print $1; exit}')"
          TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" \
            | awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1; exit}')"
          if [[ -n "$TAG_OBJECT" || -n "$TAG_COMMIT" ]]; then
            test -n "$TAG_OBJECT"
            test "$TAG_COMMIT" = "$REVIEWED_MAIN_SHA"
            git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$REVIEWED_MAIN_SHA"
            echo "existing annotated release tag is bound to reviewed main; publication may resume"
          fi
          test -z "$(git status --porcelain)"

  quality-security:
    needs: validate-reviewed-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MERCURY_LIVE_FLOWACCOUNT: "0"
      MERCURY_LIVE_FLOWACCOUNT_SANDBOX: "0"
      MERCURY_LIVE_PEAK: "0"
      MERCURY_SUPABASE_VALIDATION_TEST: "1"
      MERCURY_SUPABASE_TEST_ISOLATED: "0"
      MERCURY_SUPABASE_TEST_LOCAL_ONLY: "1"
      REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen
      - name: Install pinned secret scanners
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          TRUFFLEHOG_URL: https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.32/trufflehog_3.88.32_linux_amd64.tar.gz
          TRUFFLEHOG_SHA256: cddd1f602da61a130580883f4dd96b3d206efaf55a22068321cc11237fbc88cd
        run: |
          set -euo pipefail
          SCANNER_ROOT="$RUNNER_TEMP/mercury-scanners"
          SCANNER_BIN="$SCANNER_ROOT/bin"
          install -d -m 700 "$SCANNER_ROOT" "$SCANNER_BIN"
          curl --fail --location --silent --show-error "$GITLEAKS_URL" \
            --output "$SCANNER_ROOT/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$SCANNER_ROOT/gitleaks.tar.gz" \
            | sha256sum --check
          curl --fail --location --silent --show-error "$TRUFFLEHOG_URL" \
            --output "$SCANNER_ROOT/trufflehog.tar.gz"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "$SCANNER_ROOT/trufflehog.tar.gz" \
            | sha256sum --check
          tar -xzf "$SCANNER_ROOT/gitleaks.tar.gz" -C "$SCANNER_BIN" gitleaks
          tar -xzf "$SCANNER_ROOT/trufflehog.tar.gz" -C "$SCANNER_BIN" trufflehog
          chmod 0555 "$SCANNER_BIN/gitleaks" "$SCANNER_BIN/trufflehog"
          PATH="$SCANNER_BIN:$PATH"
          export PATH
          gitleaks version >"$SCANNER_ROOT/gitleaks-version.txt" 2>&1
          trufflehog --version >"$SCANNER_ROOT/trufflehog-version.txt" 2>&1
          printf '%s\n' "$SCANNER_BIN" >>"$GITHUB_PATH"
      - name: Scan complete Git history
        run: |
          set -euo pipefail
          SCAN_LOG="$RUNNER_TEMP/mercury-scanner-output"
          install -d -m 700 "$SCAN_LOG"
          if ! gitleaks git --config .gitleaks.toml --no-banner --redact --exit-code 1 \
            --log-opts="--all" . >"$SCAN_LOG/gitleaks-history.log" 2>&1; then
            echo "secret gate failed: gitleaks_history"
            exit 1
          fi
          TRUFFLEHOG_REPORT="$SCAN_LOG/trufflehog-history.jsonl"
          trap 'rm -f "$TRUFFLEHOG_REPORT"' EXIT
          umask 077
          if ! trufflehog git "file://$GITHUB_WORKSPACE" --concurrency=1 --no-update --no-verification --json \
            >"$TRUFFLEHOG_REPORT" 2>/dev/null; then
            echo "secret gate failed: trufflehog_history"
            exit 1
          fi
          if ! uv run python scripts/verify_trufflehog_report.py \
            --report "$TRUFFLEHOG_REPORT" \
            --allowlist docs/release/secret-scan-allowlist.json >/dev/null; then
            echo "secret gate failed: trufflehog_history"
            exit 1
          fi
          rm -f "$TRUFFLEHOG_REPORT"
          trap - EXIT
      - name: Install Supabase CLI 2.109.1
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
      - name: Start ephemeral local Supabase
        run: bash scripts/start_ephemeral_supabase.sh
      - name: Run all quality and release tests
        run: |
          set -euo pipefail
          install -d -m 700 release-evidence
          uv run ruff check .
          uv run pytest -q \
            --ignore=tests/integration/test_flowaccount_sandbox_qualification.py \
            --junitxml=release-evidence/pytest.xml
          uv run python scripts/verify_test_skips.py \
            --junit release-evidence/pytest.xml \
            --waivers docs/release/v0.3.0-test-waivers.json
          uv run mercury doctor --repo-root .
          uv run python scripts/validate_release_plugin.py --root .
          uv run python scripts/smoke_local_plugin.py
      - name: Stop ephemeral local Supabase
        if: always()
        run: supabase stop --no-backup

  supabase-migration:
    needs: quality-security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MERCURY_SUPABASE_TEST_ISOLATED: "0"
      MERCURY_SUPABASE_TEST_LOCAL_ONLY: "1"
      MERCURY_SUPABASE_VALIDATION_TEST: "1"
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: true
      - name: Install Supabase CLI 2.109.1
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.109.1
      - name: Start ephemeral local Supabase
        run: bash scripts/start_ephemeral_supabase.sh
      - name: Verify migration on ephemeral local store
        run: |
          set -euo pipefail
          uv sync --extra dev --frozen
          uv run pytest -q tests/test_validation_migration.py \
            tests/test_validation_pg17_hotfix_migration.py \
            tests/test_connector_neutral_profile_migration.py \
            tests/integration/test_supabase_validation_knowledge.py \
            --junitxml="$RUNNER_TEMP/supabase-migration.xml"
          uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["RUNNER_TEMP"] + "/supabase-migration.xml").getroot()
          if any(case.find("skipped") is not None for case in root.iter("testcase")):
              raise SystemExit("required migration test skipped")
          PY
      - name: Stop ephemeral local Supabase
        if: always()
        run: supabase stop --no-backup

  peak-contract:
    needs: supabase-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: true
      - name: Create exact PEAK contract report
        run: |
          set -euo pipefail
          uv sync --extra dev --frozen
          OUTPUT_PARENT="$RUNNER_TEMP/release-evidence/private"
          install -d -m 700 "$OUTPUT_PARENT"
          uv run mercury catalog validate --connector peak --all --repo-root . \
            >"$OUTPUT_PARENT/peak-contract-validation.json"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "release-evidence" / "private" /
               "peak-contract-validation.json").read_text()
          )
          if report.get("total") != 64 or report.get("http_attempts") != 0:
              raise SystemExit("peak contract coverage mismatch")
          PY
      - name: Retain PEAK contract report
        id: retain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: peak-contract-coverage-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/private/peak-contract-validation.json
          if-no-files-found: error
          retention-days: 1

  relayed-release-control:
    needs: peak-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      artifact_digest: ${{ steps.retain.outputs.artifact-digest }}
      payload_sha256: ${{ inputs.release_control_attestation_payload_sha256 }}
      producer_repository: ${{ steps.producer.outputs.repository }}
      producer_sha: ${{ steps.producer.outputs.sha }}
      source_repository_id: ${{ inputs.release_control_repository_id }}
      source_run_id: ${{ inputs.release_control_run_id }}
      source_run_attempt: ${{ inputs.release_control_run_attempt }}
      source_artifact_id: ${{ inputs.release_control_attestation_artifact_id }}
      source_artifact_digest: ${{ inputs.release_control_attestation_artifact_digest }}
      source_payload_sha256: ${{ inputs.release_control_attestation_payload_sha256 }}
      public_tree_digest: ${{ steps.attestation.outputs.public_tree_digest }}
      staging_ref: ${{ steps.attestation.outputs.staging_ref }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: true
      - name: Install locked release verifier
        run: uv sync --frozen --no-dev
      - name: Decode untrusted sanitized attestation transport
        env:
          ATTESTATION_B64: ${{ inputs.release_control_attestation_b64 }}
          EXPECTED_PAYLOAD_SHA256: ${{ inputs.release_control_attestation_payload_sha256 }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_B64"
          test "${#ATTESTATION_B64}" -le 60000
          OUTPUT_ROOT="$RUNNER_TEMP/relayed-release-control"
          install -d -m 700 "$OUTPUT_ROOT"
          umask 077
          printf '%s' "$ATTESTATION_B64" | base64 --decode \
            >"$OUTPUT_ROOT/trusted-hosted-attestation.json"
          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA256" \
            "$OUTPUT_ROOT/trusted-hosted-attestation.json" | sha256sum --check
      - name: Verify exact sanitized relay payload
        id: attestation
        env:
          EXPECTED_CONTROL_REPOSITORY_ID: ${{ inputs.release_control_repository_id }}
          EXPECTED_PAYLOAD_SHA256: ${{ inputs.release_control_attestation_payload_sha256 }}
          EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ inputs.release_control_run_attempt }}
          EXPECTED_PRODUCER_RUN_ID: ${{ inputs.release_control_run_id }}
          EXPECTED_PRODUCER_SHA: ${{ inputs.release_control_commit }}
          EXPECTED_REVIEWED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REVIEWED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          ATTESTATION="$RUNNER_TEMP/relayed-release-control/trusted-hosted-attestation.json"
          test -f "$ATTESTATION"
          test ! -L "$ATTESTATION"
          test "$(find "$RUNNER_TEMP/relayed-release-control" -type f | wc -l | tr -d ' ')" = "1"
          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA256" "$ATTESTATION" \
            | sha256sum --check
          PUBLIC_TREE_DIGEST="$(uv run python - <<'PY'
          from pathlib import Path
          from mercury_tools.release.artifacts import (
              load_release_candidate,
              source_tree_digest,
          )

          candidate = load_release_candidate(
              Path('.'), version='0.3.0', require_clean=True
          )
          print(source_tree_digest(candidate.entries))
          PY
          )"
          export ATTESTATION PUBLIC_TREE_DIGEST
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from mercury_tools.release.trusted_attestation_v2 import (
              load_trusted_attestation_v2,
          )

          attestation = load_trusted_attestation_v2(
              Path(os.environ['ATTESTATION']),
              expected_payload_sha256=os.environ['EXPECTED_PAYLOAD_SHA256'],
              expected_reviewed_repository=os.environ['EXPECTED_REVIEWED_REPOSITORY'],
              expected_reviewed_repository_id=int(os.environ['EXPECTED_REVIEWED_REPOSITORY_ID']),
              expected_reviewed_sha=os.environ['EXPECTED_REVIEWED_SHA'],
              expected_control_repository_id=int(os.environ['EXPECTED_CONTROL_REPOSITORY_ID']),
              expected_control_sha=os.environ['EXPECTED_PRODUCER_SHA'],
              expected_control_run_id=int(os.environ['EXPECTED_PRODUCER_RUN_ID']),
              expected_control_run_attempt=int(os.environ['EXPECTED_PRODUCER_RUN_ATTEMPT']),
              expected_public_tree_digest=os.environ['PUBLIC_TREE_DIGEST'],
          )
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as stream:
              stream.write(f'public_tree_digest={attestation.public_tree_digest}\n')
              stream.write(f'staging_ref={attestation.staging.ref}\n')
          PY
          chmod 0600 "$ATTESTATION"
      - name: Export the single reviewed producer identity
        id: producer
        run: |
          set -euo pipefail
          echo "repository=$RELEASE_CONTROL_REPOSITORY" >>"$GITHUB_OUTPUT"
          echo "sha=$RELEASE_CONTROL_PIN" >>"$GITHUB_OUTPUT"
      - name: Retain exact untrusted relay for final publisher verification
        id: retain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mercury-v0.3.0-trusted-attestation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relayed-release-control/trusted-hosted-attestation.json
          if-no-files-found: error
          retention-days: 1

  build-artifacts:
    needs: relayed-release-control
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      artifact_digest: ${{ steps.retain.outputs.artifact-digest }}
    env:
      MERCURY_RELEASE_CONTROL_REPOSITORY_ID: ${{ inputs.release_control_repository_id }}
      MERCURY_RELEASE_CONTROL_RUN_ATTEMPT: ${{ inputs.release_control_run_attempt }}
      MERCURY_RELEASE_CONTROL_RUN_ID: ${{ inputs.release_control_run_id }}
      MERCURY_RELEASE_CONTROL_SHA: ${{ inputs.release_control_commit }}
      MERCURY_REVIEWED_REPOSITORY_ID: ${{ github.repository_id }}
      MERCURY_TRUSTED_HOSTED_ATTESTATION: /release-attestation/trusted-hosted-attestation.json
      MERCURY_TRUSTED_HOSTED_ATTESTATION_SHA256: ${{ needs.relayed-release-control.outputs.payload_sha256 }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact sanitized attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.relayed-release-control.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/relayed-release-control
      - name: Prepare immutable offline dependency cache
        run: |
          set -euo pipefail
          UV_CACHE_DIR="$RUNNER_TEMP/mercury-uv-cache"
          install -d -m 700 "$UV_CACHE_DIR"
          docker run --rm --platform linux/amd64 \
            --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=1073741824 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$UV_CACHE_DIR:/release-uv-cache:rw" \
            --workdir /workspace \
            --env HOME=/tmp/mercury-home \
            --env UV_CACHE_DIR=/release-uv-cache \
            --env UV_PROJECT_ENVIRONMENT=/tmp/mercury-prefetch-venv \
            --env UV_PYTHON=/usr/local/bin/python3.12 \
            --env UV_PYTHON_DOWNLOADS=never \
            docker.io/library/python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db \
            sh -ceu '
              printf "%s  %s\n" \
                f05934ddce884a121981d94c16f274a12bfc7829e48943a7f9455bb255b0be40 \
                release-toolchain/uv-linux-x86_64 | sha256sum --check
              printf "%s  %s\n" \
            d2d45cb9dd550cd1535bf548c8ab54256c98085f3f0531d8f79020e004eaa525 \
                uv.lock | sha256sum --check
              release-toolchain/uv-linux-x86_64 sync \
                --frozen --no-dev --no-install-project --no-build
            '
          chmod -R a-w "$UV_CACHE_DIR"
      - name: Install checksum-verified scanners for the pinned build runtime
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          TRUFFLEHOG_URL: https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.32/trufflehog_3.88.32_linux_amd64.tar.gz
          TRUFFLEHOG_SHA256: cddd1f602da61a130580883f4dd96b3d206efaf55a22068321cc11237fbc88cd
        run: |
          set -euo pipefail
          SCANNER_ROOT="$RUNNER_TEMP/mercury-scanners"
          SCANNER_BIN="$SCANNER_ROOT/bin"
          install -d -m 700 "$SCANNER_ROOT" "$SCANNER_BIN"
          curl --fail --location --silent --show-error "$GITLEAKS_URL" \
            --output "$SCANNER_ROOT/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$SCANNER_ROOT/gitleaks.tar.gz" \
            | sha256sum --check
          curl --fail --location --silent --show-error "$TRUFFLEHOG_URL" \
            --output "$SCANNER_ROOT/trufflehog.tar.gz"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "$SCANNER_ROOT/trufflehog.tar.gz" \
            | sha256sum --check
          tar -xzf "$SCANNER_ROOT/gitleaks.tar.gz" -C "$SCANNER_BIN" gitleaks
          tar -xzf "$SCANNER_ROOT/trufflehog.tar.gz" -C "$SCANNER_BIN" trufflehog
          chmod 0555 "$SCANNER_BIN/gitleaks" "$SCANNER_BIN/trufflehog"
      - name: Prepare size-limited build output filesystem
        run: |
          set -euo pipefail
          OUTPUT_PARENT="$RUNNER_TEMP/mercury-build-output"
          install -d -m 700 "$OUTPUT_PARENT"
          sudo mount -t tmpfs \
            -o "size=2147483648,nosuid,nodev,noexec,mode=0700,uid=$(id -u),gid=$(id -g)" \
            tmpfs "$OUTPUT_PARENT"
          test "$(stat -c '%a' "$OUTPUT_PARENT")" = "700"
      - name: Build and verify in the isolated candidate runtime
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r RELEASE_PLATFORM RELEASE_IMAGE RELEASE_UV_SOURCE_IMAGE < <(
            python3 - <<'PY'
          import hashlib
          import json
          import re
          import tomllib
          from pathlib import Path

          policy = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["mercury"]["release-build"]
          descriptor_policy = policy["platform"]
          if descriptor_policy["path"] != "release-toolchain/platform.json":
              raise SystemExit("unexpected platform descriptor path")
          descriptor_path = Path(descriptor_policy["path"])
          descriptor_bytes = descriptor_path.read_bytes()
          if hashlib.sha256(descriptor_bytes).hexdigest() != descriptor_policy["sha256"]:
              raise SystemExit("platform descriptor hash mismatch")
          descriptor = json.loads(descriptor_bytes)
          if set(descriptor) != {"schema_version", "architecture", "image", "uv_source_image"}:
              raise SystemExit("platform descriptor schema mismatch")
          if descriptor["schema_version"] != 1 or descriptor["architecture"] != "linux/amd64":
              raise SystemExit("platform descriptor value mismatch")
          image_pattern = re.compile(r"^[a-z0-9][a-z0-9._/-]{0,255}@sha256:[0-9a-f]{64}$")
          for key in ("image", "uv_source_image"):
              if not isinstance(descriptor[key], str) or image_pattern.fullmatch(descriptor[key]) is None:
                  raise SystemExit(f"unpinned {key}")
          print("\t".join((descriptor["architecture"], descriptor["image"], descriptor["uv_source_image"])))
          PY
          )
          test -n "$RELEASE_PLATFORM"
          test -n "$RELEASE_IMAGE"
          test -n "$RELEASE_UV_SOURCE_IMAGE"
          export RELEASE_UV_SOURCE_IMAGE
          OUTPUT_PARENT="$RUNNER_TEMP/mercury-build-output"
          test "$(stat -c '%a' "$OUTPUT_PARENT")" = "700"
          test ! -e "$OUTPUT_PARENT/artifacts"
          test "$(git rev-parse HEAD)" = "$REVIEWED_MAIN_SHA"
          docker run --rm --platform "$RELEASE_PLATFORM" \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=2147483648 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/mercury-scanners/bin:/release-bin:ro" \
            --volume "$RUNNER_TEMP/mercury-uv-cache:/release-uv-cache:ro" \
            --volume "$RUNNER_TEMP/relayed-release-control/trusted-hosted-attestation.json:/release-attestation/trusted-hosted-attestation.json:ro" \
            --volume "$OUTPUT_PARENT:/release-output:rw" \
            --workdir /workspace \
            --env MERCURY_RELEASE_CONTROL_REPOSITORY_ID \
            --env MERCURY_RELEASE_CONTROL_RUN_ATTEMPT \
            --env MERCURY_RELEASE_CONTROL_RUN_ID \
            --env MERCURY_RELEASE_CONTROL_SHA \
            --env MERCURY_REVIEWED_REPOSITORY_ID \
            --env MERCURY_TRUSTED_HOSTED_ATTESTATION \
            --env MERCURY_TRUSTED_HOSTED_ATTESTATION_SHA256 \
            --env RELEASE_UV_SOURCE_IMAGE \
            --env HOME=/tmp/mercury-home --env UV_CACHE_DIR=/tmp/uv-cache \
            --env UV_PROJECT_ENVIRONMENT=/tmp/mercury-venv \
            --env UV_HTTP_TIMEOUT=120 --env UV_PYTHON=/usr/local/bin/python3.12 \
            --env UV_PYTHON_DOWNLOADS=never \
            "$RELEASE_IMAGE" sh -ceu '
              test -n "$RELEASE_UV_SOURCE_IMAGE"
              cp -a /release-uv-cache /tmp/uv-cache
              chmod -R u+w /tmp/uv-cache
              export PATH="/release-bin:$PATH"
              release-toolchain/uv-linux-x86_64 run --offline --frozen --no-dev python \
                scripts/build_release_artifacts.py --version 0.3.0 \
                --output /release-output/artifacts
              release-toolchain/uv-linux-x86_64 run --offline --frozen --no-dev python \
                scripts/verify_release.py --version 0.3.0 \
                --artifacts /release-output/artifacts
            '
          python3 scripts/validate_candidate_output.py "$OUTPUT_PARENT" \
            --max-files 100 --max-bytes 2147483648
      - name: Retain verified release artifacts for this attempt
        id: retain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mercury-v0.3.0-release-artifacts-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mercury-build-output/artifacts
          if-no-files-found: error
          retention-days: 1
      - name: Unmount size-limited build output filesystem
        if: always()
        run: |
          set -euo pipefail
          OUTPUT_PARENT="$RUNNER_TEMP/mercury-build-output"
          if mountpoint -q "$OUTPUT_PARENT"; then
            sudo umount "$OUTPUT_PARENT"
          fi
          rm -rf "$OUTPUT_PARENT"

  release-ready:
    needs: [relayed-release-control, build-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      artifact_digest: ${{ steps.retain.outputs.artifact-digest }}
      payload_sha256: ${{ steps.payload.outputs.sha256 }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact release artifact bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build-artifacts.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-ready/artifacts
      - name: Download exact sanitized attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.relayed-release-control.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-ready/attestation
      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
      - name: Install locked handoff writer
        run: uv sync --frozen --no-dev
      - name: Create exact schema-v3 release-ready handoff
        env:
          CONTROL_ARTIFACT_DIGEST: ${{ inputs.release_control_attestation_artifact_digest }}
          CONTROL_ARTIFACT_ID: ${{ inputs.release_control_attestation_artifact_id }}
          CONTROL_PAYLOAD_SHA256: ${{ inputs.release_control_attestation_payload_sha256 }}
          CONTROL_REPOSITORY_ID: ${{ inputs.release_control_repository_id }}
          CONTROL_RUN_ATTEMPT: ${{ inputs.release_control_run_attempt }}
          CONTROL_RUN_ID: ${{ inputs.release_control_run_id }}
          CONTROL_SHA: ${{ inputs.release_control_commit }}
          PUBLIC_TREE_DIGEST: ${{ needs.relayed-release-control.outputs.public_tree_digest }}
          RELEASE_BUNDLE_ARTIFACT_DIGEST: ${{ needs.build-artifacts.outputs.artifact_digest }}
          RELEASE_BUNDLE_ARTIFACT_ID: ${{ needs.build-artifacts.outputs.artifact_id }}
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/mercury-v0.3.0-release-ready.json"
          uv run python -m mercury_tools.release.handoff_v3 \
            --artifacts "$RUNNER_TEMP/release-ready/artifacts" \
            --attestation "$RUNNER_TEMP/release-ready/attestation/trusted-hosted-attestation.json" \
            --attestation-file-sha256 "$CONTROL_PAYLOAD_SHA256" \
            --reviewed-repository-id "$GITHUB_REPOSITORY_ID" \
            --reviewed-sha "$REVIEWED_SHA" \
            --control-repository-id "$CONTROL_REPOSITORY_ID" \
            --control-sha "$CONTROL_SHA" \
            --control-run-id "$CONTROL_RUN_ID" \
            --control-run-attempt "$CONTROL_RUN_ATTEMPT" \
            --control-artifact-id "$CONTROL_ARTIFACT_ID" \
            --control-artifact-digest "$CONTROL_ARTIFACT_DIGEST" \
            --public-tree-digest "$PUBLIC_TREE_DIGEST" \
            --mercury-repository-id "$GITHUB_REPOSITORY_ID" \
            --mercury-run-id "$GITHUB_RUN_ID" \
            --mercury-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-bundle-artifact-id "$RELEASE_BUNDLE_ARTIFACT_ID" \
            --release-bundle-artifact-digest "$RELEASE_BUNDLE_ARTIFACT_DIGEST" \
            --output "$OUTPUT"
          jq -e '.schema_version == 3 and (.release_bundle | type == "object")' \
            "$OUTPUT" >/dev/null
      - name: Record exact release-ready payload digest
        id: payload
        run: |
          set -euo pipefail
          SHA256="$(sha256sum "$RUNNER_TEMP/mercury-v0.3.0-release-ready.json" | awk '{print $1}')"
          echo "sha256=$SHA256" >>"$GITHUB_OUTPUT"
      - name: Retain release-ready handoff for this attempt
        id: retain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mercury-v0.3.0-release-ready-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mercury-v0.3.0-release-ready.json
          if-no-files-found: error
          retention-days: 1
