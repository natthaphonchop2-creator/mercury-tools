name: Migrate repository secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ secrets.MERCURY_SECRET_MIGRATION_TOKEN }}
    steps:
      - name: Validate migration inputs
        run: |
          set -euo pipefail
          test "$SOURCE_SUPABASE_URL" = "https://vbnlkqvauqwnjbxngkas.supabase.co"
          test -n "$SOURCE_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GH_TOKEN"

      - name: Move Supabase secrets to production-data
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SUPABASE_URL" \
            | gh secret set SUPABASE_URL \
                --repo "$GITHUB_REPOSITORY" \
                --env production-data
          printf '%s' "$SOURCE_SUPABASE_SERVICE_ROLE_KEY" \
            | gh secret set SUPABASE_SERVICE_ROLE_KEY \
                --repo "$GITHUB_REPOSITORY" \
                --env production-data

          environment_names="$(
            gh secret list \
              --repo "$GITHUB_REPOSITORY" \
              --env production-data \
              --json name \
              --jq 'map(.name) | sort | join(",")'
          )"
          test "$environment_names" = "SUPABASE_SERVICE_ROLE_KEY,SUPABASE_URL"

      - name: Remove migrated repository secrets
        run: |
          set -euo pipefail
          gh secret delete SUPABASE_URL --repo "$GITHUB_REPOSITORY"
          gh secret delete SUPABASE_SERVICE_ROLE_KEY --repo "$GITHUB_REPOSITORY"
          gh secret delete MERCURY_SECRET_MIGRATION_TOKEN --repo "$GITHUB_REPOSITORY"

          repository_names="$(
            gh secret list \
              --repo "$GITHUB_REPOSITORY" \
              --json name \
              --jq 'map(.name) | sort | join(",")'
          )"
          test -z "$repository_names"
