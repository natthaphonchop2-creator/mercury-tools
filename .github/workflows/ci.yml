name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release runtime inputs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify pinned offline native runtime
        run: |
          set -euo pipefail
          IFS=$'\t' read -r RELEASE_PLATFORM RELEASE_IMAGE < <(
            python3 - <<'PY'
          import hashlib
          import json
          import re
          import tomllib
          from pathlib import Path

          policy = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["mercury"]["release-build"]
          descriptor_policy = policy["platform"]
          if descriptor_policy["path"] != "release-toolchain/platform.json":
              raise SystemExit("unexpected platform descriptor path")
          descriptor_path = Path(descriptor_policy["path"])
          descriptor_bytes = descriptor_path.read_bytes()
          if hashlib.sha256(descriptor_bytes).hexdigest() != descriptor_policy["sha256"]:
              raise SystemExit("platform descriptor hash mismatch")
          if hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest() != policy["lock_sha256"]:
              raise SystemExit("uv lock hash mismatch")
          uv_policy = policy["uv"]
          if uv_policy["path"] != "release-toolchain/uv-linux-x86_64":
              raise SystemExit("unexpected uv binary path")
          if hashlib.sha256(Path(uv_policy["path"]).read_bytes()).hexdigest() != uv_policy["sha256"]:
              raise SystemExit("uv binary hash mismatch")
          descriptor = json.loads(descriptor_bytes)
          image_pattern = re.compile(r"^[a-z0-9][a-z0-9._/-]{0,255}@sha256:[0-9a-f]{64}$")
          if descriptor.get("architecture") != "linux/amd64":
              raise SystemExit("unexpected release architecture")
          if image_pattern.fullmatch(str(descriptor.get("image", ""))) is None:
              raise SystemExit("unpinned release image")
          print(f"{descriptor['architecture']}\t{descriptor['image']}")
          PY
          )
          test -n "$RELEASE_PLATFORM"
          test -n "$RELEASE_IMAGE"
          CACHE_DIR="$RUNNER_TEMP/mercury-release-runtime-smoke-cache"
          install -d -m 700 "$CACHE_DIR"
          docker run --rm --platform "$RELEASE_PLATFORM" \
            --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777,size=1073741824 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$CACHE_DIR:/release-uv-cache:rw" \
            --workdir /workspace \
            --env HOME=/tmp/mercury-home \
            --env UV_CACHE_DIR=/release-uv-cache \
            --env UV_PROJECT_ENVIRONMENT=/tmp/mercury-prefetch-venv \
            --env UV_PYTHON=/usr/local/bin/python3.12 \
            --env UV_PYTHON_DOWNLOADS=never \
            "$RELEASE_IMAGE" sh -ceu '
              release-toolchain/uv-linux-x86_64 sync \
                --frozen --no-dev --no-install-project --no-build
            '
          chmod -R a-w "$CACHE_DIR"
          docker run --rm --platform "$RELEASE_PLATFORM" \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777,size=1073741824 \
            --tmpfs "/release-runtime:rw,exec,nosuid,nodev,mode=0700,uid=$(id -u),gid=$(id -g),size=1073741824" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$CACHE_DIR:/release-uv-cache:ro" \
            --workdir /workspace \
            --env HOME=/release-runtime/home \
            --env TMPDIR=/release-runtime/tmp \
            --env UV_CACHE_DIR=/release-runtime/uv-cache \
            --env UV_PROJECT_ENVIRONMENT=/release-runtime/mercury-venv \
            --env UV_PYTHON=/usr/local/bin/python3.12 \
            --env UV_PYTHON_DOWNLOADS=never \
            "$RELEASE_IMAGE" sh -ceu '
              TMP_MOUNT_OPTIONS="$(awk '\''$2 == "/tmp" { print $4 }'\'' /proc/mounts)"
              RUNTIME_MOUNT_OPTIONS="$(awk '\''$2 == "/release-runtime" { print $4 }'\'' /proc/mounts)"
              case ",$TMP_MOUNT_OPTIONS," in
                *,noexec,*) ;;
                *) echo "release runtime smoke: /tmp must be noexec" >&2; exit 64 ;;
              esac
              case ",$RUNTIME_MOUNT_OPTIONS," in
                *,noexec,*) echo "release runtime smoke: dedicated mount must be executable" >&2; exit 64 ;;
                *) ;;
              esac
              test "$(stat -c '\''%u:%g:%a'\'' /release-runtime)" = "$(id -u):$(id -g):700"
              install -d -m 700 "$HOME" "$TMPDIR"
              cp -a /release-uv-cache "$UV_CACHE_DIR"
              chmod -R u+w "$UV_CACHE_DIR"
              release-toolchain/uv-linux-x86_64 sync \
                --offline --frozen --no-dev --no-install-project --no-build
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/workspace/src \
                /release-runtime/mercury-venv/bin/python -c '\''
          import pathlib
          import sys
          import tempfile
          from pydantic_core import _pydantic_core

          runtime = pathlib.Path("/release-runtime/mercury-venv")
          if pathlib.Path(sys.executable).as_posix() != str(runtime / "bin/python"):
              raise SystemExit("release runtime smoke: unexpected interpreter path")
          if not pathlib.Path(_pydantic_core.__file__).resolve().is_relative_to(runtime):
              raise SystemExit("release runtime smoke: native module escaped candidate runtime")
          if tempfile.gettempdir() != "/release-runtime/tmp":
              raise SystemExit("release runtime smoke: unexpected temporary directory")
          '\''
            '

  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MERCURY_LIVE_FLOWACCOUNT: "0"
      MERCURY_LIVE_FLOWACCOUNT_SANDBOX: "0"
      MERCURY_LIVE_PEAK: "0"
      MERCURY_SUPABASE_VALIDATION_TEST: "1"
      MERCURY_SUPABASE_TEST_ISOLATED: "0"
      MERCURY_SUPABASE_TEST_LOCAL_ONLY: "1"
      UV_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: false

      - name: Set up Node.js 22.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Install locked dependencies
        run: uv sync --extra dev --frozen

      - name: Install Codex CLI 0.144.6
        run: npm install -g @openai/codex@0.144.6 --no-audit --no-fund

      - name: Verify Codex CLI
        run: codex --version

      - name: Install pinned secret scanners
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          TRUFFLEHOG_URL: https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.32/trufflehog_3.88.32_linux_amd64.tar.gz
          TRUFFLEHOG_SHA256: cddd1f602da61a130580883f4dd96b3d206efaf55a22068321cc11237fbc88cd
        run: |
          set -euo pipefail
          SCANNER_ROOT="$RUNNER_TEMP/mercury-scanners"
          SCANNER_BIN="$SCANNER_ROOT/bin"
          install -d -m 700 "$SCANNER_ROOT" "$SCANNER_BIN"
          curl --fail --location --silent --show-error "$GITLEAKS_URL" \
            --output "$SCANNER_ROOT/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$SCANNER_ROOT/gitleaks.tar.gz" \
            | sha256sum --check
          curl --fail --location --silent --show-error "$TRUFFLEHOG_URL" \
            --output "$SCANNER_ROOT/trufflehog.tar.gz"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "$SCANNER_ROOT/trufflehog.tar.gz" \
            | sha256sum --check
          tar -xzf "$SCANNER_ROOT/gitleaks.tar.gz" -C "$SCANNER_BIN" gitleaks
          tar -xzf "$SCANNER_ROOT/trufflehog.tar.gz" -C "$SCANNER_BIN" trufflehog
          chmod 0555 "$SCANNER_BIN/gitleaks" "$SCANNER_BIN/trufflehog"
          PATH="$SCANNER_BIN:$PATH"
          export PATH
          gitleaks version >"$SCANNER_ROOT/gitleaks-version.txt" 2>&1
          trufflehog --version >"$SCANNER_ROOT/trufflehog-version.txt" 2>&1
          printf '%s\n' "$SCANNER_BIN" >>"$GITHUB_PATH"

      - name: Scan full Git history
        run: |
          set -euo pipefail
          SCAN_LOG="$RUNNER_TEMP/mercury-scanner-output"
          install -d -m 700 "$SCAN_LOG"
          if ! gitleaks git --config .gitleaks.toml --no-banner --redact --exit-code 1 \
            --log-opts="--all" . >"$SCAN_LOG/gitleaks-history.log" 2>&1; then
            echo "secret gate failed: gitleaks_history"
            exit 1
          fi
          TRUFFLEHOG_REPORT="$SCAN_LOG/trufflehog-history.jsonl"
          trap 'rm -f "$TRUFFLEHOG_REPORT"' EXIT
          umask 077
          if ! trufflehog git "file://$GITHUB_WORKSPACE" --concurrency=1 --no-update --no-verification --json \
            >"$TRUFFLEHOG_REPORT" 2>/dev/null; then
            echo "secret gate failed: trufflehog_history"
            exit 1
          fi
          if ! uv run python scripts/verify_trufflehog_report.py \
            --report "$TRUFFLEHOG_REPORT" \
            --allowlist docs/release/secret-scan-allowlist.json >/dev/null; then
            echo "secret gate failed: trufflehog_history"
            exit 1
          fi
          rm -f "$TRUFFLEHOG_REPORT"
          trap - EXIT

      - name: Install Supabase CLI 2.109.1 without persistent cache
        run: |
          set -euo pipefail
          CLI_ROOT="$RUNNER_TEMP/mercury-supabase-cli"
          npm install --prefix "$CLI_ROOT" --no-audit --no-fund --save-exact supabase@2.109.1
          printf '%s\n' "$CLI_ROOT/node_modules/.bin" >>"$GITHUB_PATH"
          INSTALLED_VERSION="$("$CLI_ROOT/node_modules/.bin/supabase" --version)"
          test "$INSTALLED_VERSION" = "2.109.1"

      - name: Start ephemeral local Supabase
        run: bash scripts/start_ephemeral_supabase.sh

      - name: Run complete quality and test gates
        run: |
          set -euo pipefail
          install -d -m 700 release-evidence
          uv run ruff check .
          uv run pytest -q \
            --ignore=tests/integration/test_flowaccount_sandbox_qualification.py \
            --junitxml=release-evidence/pytest.xml
          uv run python scripts/verify_test_skips.py \
            --junit release-evidence/pytest.xml \
            --waivers docs/release/v0.3.0-test-waivers.json
          uv run mercury doctor --repo-root .
          uv run python scripts/validate_release_plugin.py --root .
          uv run python scripts/smoke_local_plugin.py

      - name: Stop ephemeral local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Build and scan package artifacts
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/ci-dist"
          SCAN_LOG="$RUNNER_TEMP/mercury-artifact-scan"
          install -d -m 700 "$ARTIFACT_ROOT" "$SCAN_LOG"
          uv build --wheel --sdist --out-dir "$ARTIFACT_ROOT"
          if ! gitleaks dir --config .gitleaks.toml --no-banner --redact --exit-code 1 "$ARTIFACT_ROOT" \
            >"$SCAN_LOG/gitleaks-artifacts.log" 2>&1; then
            echo "secret gate failed: gitleaks_artifacts"
            exit 1
          fi
          TRUFFLEHOG_REPORT="$SCAN_LOG/trufflehog-artifacts.jsonl"
          trap 'rm -f "$TRUFFLEHOG_REPORT"' EXIT
          umask 077
          if ! trufflehog filesystem "$ARTIFACT_ROOT" --concurrency=1 --no-update --no-verification --fail --json \
            >"$TRUFFLEHOG_REPORT" 2>/dev/null; then
            echo "secret gate failed: trufflehog_artifacts"
            exit 1
          fi
          rm -f "$TRUFFLEHOG_REPORT"
          trap - EXIT

  public:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MERCURY_LIVE_FLOWACCOUNT: "0"
      MERCURY_LIVE_FLOWACCOUNT_SANDBOX: "0"
      MERCURY_LIVE_PEAK: "0"
      MERCURY_SUPABASE_VALIDATION_TEST: "0"
      MERCURY_SUPABASE_TEST_ISOLATED: "0"
      UV_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout untrusted PR or branch source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv 0.11.9
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9
          enable-cache: false

      - name: Set up Node.js 22.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Install locked dependencies
        run: uv sync --extra dev --frozen

      - name: Install Codex CLI 0.144.6
        run: npm install -g @openai/codex@0.144.6 --no-audit --no-fund

      - name: Verify Codex CLI
        run: codex --version

      - name: Install pinned secret scanners
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          TRUFFLEHOG_URL: https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.32/trufflehog_3.88.32_linux_amd64.tar.gz
          TRUFFLEHOG_SHA256: cddd1f602da61a130580883f4dd96b3d206efaf55a22068321cc11237fbc88cd
        run: |
          set -euo pipefail
          SCANNER_ROOT="$RUNNER_TEMP/mercury-scanners"
          SCANNER_BIN="$SCANNER_ROOT/bin"
          install -d -m 700 "$SCANNER_ROOT" "$SCANNER_BIN"
          curl --fail --location --silent --show-error "$GITLEAKS_URL" \
            --output "$SCANNER_ROOT/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$SCANNER_ROOT/gitleaks.tar.gz" \
            | sha256sum --check
          curl --fail --location --silent --show-error "$TRUFFLEHOG_URL" \
            --output "$SCANNER_ROOT/trufflehog.tar.gz"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "$SCANNER_ROOT/trufflehog.tar.gz" \
            | sha256sum --check
          tar -xzf "$SCANNER_ROOT/gitleaks.tar.gz" -C "$SCANNER_BIN" gitleaks
          tar -xzf "$SCANNER_ROOT/trufflehog.tar.gz" -C "$SCANNER_BIN" trufflehog
          chmod 0555 "$SCANNER_BIN/gitleaks" "$SCANNER_BIN/trufflehog"
          PATH="$SCANNER_BIN:$PATH"
          export PATH
          gitleaks version >"$SCANNER_ROOT/gitleaks-version.txt" 2>&1
          trufflehog --version >"$SCANNER_ROOT/trufflehog-version.txt" 2>&1
          printf '%s\n' "$SCANNER_BIN" >>"$GITHUB_PATH"

      - name: Scan untrusted source history without credentials
        run: |
          set -euo pipefail
          SCAN_LOG="$RUNNER_TEMP/mercury-scanner-output"
          install -d -m 700 "$SCAN_LOG"
          if ! gitleaks git --config .gitleaks.toml --no-banner --redact --exit-code 1 \
            --log-opts="--all" . >"$SCAN_LOG/gitleaks-history.log" 2>&1; then
            echo "secret gate failed: gitleaks_history"
            exit 1
          fi
          TRUFFLEHOG_REPORT="$SCAN_LOG/trufflehog-history.jsonl"
          trap 'rm -f "$TRUFFLEHOG_REPORT"' EXIT
          umask 077
          if ! trufflehog git "file://$GITHUB_WORKSPACE" --concurrency=1 --no-update --no-verification --json \
            >"$TRUFFLEHOG_REPORT" 2>/dev/null; then
            echo "secret gate failed: trufflehog_history"
            exit 1
          fi
          if ! uv run python scripts/verify_trufflehog_report.py \
            --report "$TRUFFLEHOG_REPORT" \
            --allowlist docs/release/secret-scan-allowlist.json >/dev/null; then
            echo "secret gate failed: trufflehog_history"
            exit 1
          fi
          rm -f "$TRUFFLEHOG_REPORT"
          trap - EXIT

      - name: Run public quality and static gates
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run pytest -q --ignore=tests/integration
          uv run python scripts/validate_release_plugin.py --root .
          uv run python scripts/smoke_local_plugin.py

      - name: Build and scan public package artifacts
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/ci-dist"
          SCAN_LOG="$RUNNER_TEMP/mercury-artifact-scan"
          install -d -m 700 "$ARTIFACT_ROOT" "$SCAN_LOG"
          uv build --wheel --sdist --out-dir "$ARTIFACT_ROOT"
          if ! gitleaks dir --config .gitleaks.toml --no-banner --redact --exit-code 1 "$ARTIFACT_ROOT" \
            >"$SCAN_LOG/gitleaks-artifacts.log" 2>&1; then
            echo "secret gate failed: gitleaks_artifacts"
            exit 1
          fi
          TRUFFLEHOG_REPORT="$SCAN_LOG/trufflehog-artifacts.jsonl"
          trap 'rm -f "$TRUFFLEHOG_REPORT"' EXIT
          umask 077
          if ! trufflehog filesystem "$ARTIFACT_ROOT" --concurrency=1 --no-update --no-verification --fail --json \
            >"$TRUFFLEHOG_REPORT" 2>/dev/null; then
            echo "secret gate failed: trufflehog_artifacts"
            exit 1
          fi
          rm -f "$TRUFFLEHOG_REPORT"
          trap - EXIT
