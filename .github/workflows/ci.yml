name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MERCURY_LIVE_FLOWACCOUNT: "0"
      MERCURY_LIVE_FLOWACCOUNT_SANDBOX: "0"
      MERCURY_LIVE_PEAK: "0"
      MERCURY_SUPABASE_VALIDATION_TEST: "0"
      UV_HTTP_TIMEOUT: "120"
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: 0.11.9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: |
          uv sync --extra dev --frozen
          npm install -g @openai/codex@0.146.0-alpha.3.1 --no-audit --no-fund

      - name: Lint and test
        run: |
          uv run ruff check .
          uv run pytest -q --ignore=tests/integration

      - name: Validate MCP and plugin contracts
        run: |
          uv run python scripts/review_mcp_contract.py
          uv run python scripts/validate_plugin.py

      - name: Build package
        run: uv build --wheel --sdist --out-dir dist

      - name: Install gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl --fail --location --silent --show-error "$GITLEAKS_URL" --output /tmp/gitleaks.tar.gz
          printf '%s  %s\n' "$GITLEAKS_SHA256" /tmp/gitleaks.tar.gz | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod 0555 /tmp/gitleaks

      - name: Scan Git history and release artifacts
        run: |
          /tmp/gitleaks git --config .gitleaks.toml --no-banner --redact --exit-code 1 --log-opts="--all" .
          mkdir -p /tmp/mercury-dist-scan/wheel /tmp/mercury-dist-scan/sdist
          unzip -q dist/*.whl -d /tmp/mercury-dist-scan/wheel
          tar -xzf dist/*.tar.gz -C /tmp/mercury-dist-scan/sdist
          (
            cd /tmp/mercury-dist-scan
            /tmp/gitleaks dir --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
              --no-banner --redact --exit-code 1 .
          )
          /tmp/gitleaks dir --config .gitleaks.toml --no-banner --redact --exit-code 1 plugins/mercury-finance

      - name: Smoke one-click install and hosted MCP
        run: uv run python scripts/smoke_hosted_plugin.py --repo-root .
