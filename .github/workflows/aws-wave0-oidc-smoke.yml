name: AWS Wave 0 OIDC smoke

on:
  workflow_dispatch:
    inputs:
      evidence_nonce:
        description: Non-secret identifier used to select this exact workflow run
        required: true
        type: string

run-name: AWS Wave 0 OIDC smoke [${{ inputs.evidence_nonce }}]

permissions:
  contents: read
  id-token: write

jobs:
  oidc-smoke:
    name: OIDC smoke (${{ matrix.environment }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - nonprod
          - production
    steps:
      - name: Assume Wave 0 read-only role
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8
        with:
          role-to-assume: ${{ vars.AWS_WAVE0_ROLE_ARN }}
          aws-region: ap-southeast-1
          mask-aws-account-id: true

      - name: Run read-only Wave 0 probes
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/mercury-wave0-oidc"
          mkdir -p "${output_dir}"

          aws sts get-caller-identity --region ap-southeast-1 >"${output_dir}/sts.json" 2>&1
          aws bedrock-agentcore-control list-agent-runtimes --max-results 1 --region ap-southeast-1 >"${output_dir}/agentcore-runtimes.json" 2>&1
          aws bedrock-agentcore-control list-gateways --max-results 1 --region ap-southeast-1 >"${output_dir}/agentcore-gateways.json" 2>&1
          aws bedrock-agentcore-control list-workload-identities --max-results 1 --region ap-southeast-1 >"${output_dir}/agentcore-identities.json" 2>&1
          aws bedrock-agent list-knowledge-bases --max-results 1 --region ap-southeast-1 >"${output_dir}/knowledge-bases.json" 2>&1
          aws rds describe-orderable-db-instance-options --engine aurora-postgresql --db-instance-class db.serverless --max-records 1 --region ap-southeast-1 >"${output_dir}/aurora-options.json" 2>&1
          aws s3api list-buckets --region ap-southeast-1 >"${output_dir}/s3-buckets.json" 2>&1
          aws kms list-aliases --limit 1 --region ap-southeast-1 >"${output_dir}/kms-aliases.json" 2>&1
          aws ecr describe-repositories --max-results 1 --region ap-southeast-1 >"${output_dir}/ecr-repositories.json" 2>&1
          aws logs describe-log-groups --limit 1 --region ap-southeast-1 >"${output_dir}/log-groups.json" 2>&1
          aws service-quotas list-service-quotas --service-code bedrock-agentcore --max-results 100 --region ap-southeast-1 >"${output_dir}/agentcore-quotas.json" 2>&1

          printf 'environment=%s\n' "${{ matrix.environment }}"
          printf 'wave0_oidc_smoke=pass\n'
