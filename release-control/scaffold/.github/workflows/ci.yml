name: Mercury release-control CI

on:
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  reporter:
    name: reporter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      TRUSTED_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout trusted base verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout candidate as untrusted data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate
      - name: Bind trusted and candidate identities
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C trusted status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"
      - name: Verify candidate with base-owned code
        id: verify
        run: |
          set -uo pipefail
          if python3 trusted/scripts/verify_candidate.py \
            --trusted-root trusted \
            --candidate-root candidate
          then
            echo "outcome=success" >>"$GITHUB_OUTPUT"
            echo "description=trusted release-control candidate passed" >>"$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >>"$GITHUB_OUTPUT"
            echo "description=trusted release-control candidate failed" >>"$GITHUB_OUTPUT"
          fi
      - name: Publish required status on the candidate commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verify.outputs.outcome }}
          DESCRIPTION: ${{ steps.verify.outputs.description }}
        run: |
          set -euo pipefail
          STATE="$OUTCOME"
          if [[ "$STATE" != "success" && "$STATE" != "failure" ]]; then
            STATE="failure"
            DESCRIPTION="trusted release-control verifier did not complete"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state="$STATE" \
            -f context="Mercury release-control CI / required" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
      - name: Fail the workflow when the trusted verifier rejects
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.verify.outputs.outcome }}" = "success"
