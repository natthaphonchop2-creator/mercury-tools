name: Mercury v0.2.1 trusted publication

on:
  workflow_dispatch:
    inputs:
      reviewed_commit_sha:
        description: Exact reviewed mercury-tools commit
        required: true
        type: string
      mercury_run_id:
        description: Successful Mercury release workflow run ID
        required: true
        type: string
      mercury_run_attempt:
        description: Successful Mercury release workflow run attempt
        required: true
        type: string
      control_run_id:
        description: Trusted attestation producer run ID
        required: true
        type: string
      control_run_attempt:
        description: Trusted attestation producer run attempt
        required: true
        type: string
      handoff_artifact_id:
        description: Exact Mercury release-ready artifact ID
        required: true
        type: string
      handoff_artifact_digest:
        description: Exact Mercury release-ready artifact digest
        required: true
        type: string
      handoff_payload_sha256:
        description: Exact Mercury release-ready JSON SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  remote-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    steps:
      - name: Checkout exact release-control implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify remote environment and branch protections
        env:
          RELEASE_CONTROL_PREFLIGHT_TOKEN: ${{ secrets.RELEASE_CONTROL_PREFLIGHT_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify_remote_preflight.py \
            --policy policy-v0.2.1.json \
            --output "$RUNNER_TEMP/publication-preflight.json"

  publish:
    needs: remote-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    steps:
      - name: Checkout exact release-control implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind publication target to reviewed policy
        id: target
        env:
          CONFIGURED_TARGET_REPOSITORY: ${{ vars.TARGET_REPOSITORY }}
          GH_TOKEN: ${{ secrets.MERCURY_TARGET_REPOSITORY_READ_TOKEN }}
        run: |
          set -euo pipefail
          POLICY_TARGET_REPOSITORY="$(jq -er \
            '.["reviewed_repository"] |
             select(type == "string" and
                    test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' \
            policy-v0.2.1.json)"
          POLICY_TARGET_REPOSITORY_ID="$(jq -er \
            '.["reviewed_repository_id"] |
             select(type == "number" and . == floor and . > 0)' \
            policy-v0.2.1.json)"
          [[ "$POLICY_TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$POLICY_TARGET_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          test "$CONFIGURED_TARGET_REPOSITORY" = "$POLICY_TARGET_REPOSITORY"
          TARGET_METADATA="$RUNNER_TEMP/policy-target-repository.json"
          gh api "repos/$POLICY_TARGET_REPOSITORY" >"$TARGET_METADATA"
          jq -e \
            --arg repository "$POLICY_TARGET_REPOSITORY" \
            --argjson repository_id "$POLICY_TARGET_REPOSITORY_ID" \
            '(.full_name == $repository) and (.id == $repository_id)' \
            "$TARGET_METADATA" >/dev/null
          echo "repository=$POLICY_TARGET_REPOSITORY" >>"$GITHUB_OUTPUT"
          echo "repository_id=$POLICY_TARGET_REPOSITORY_ID" >>"$GITHUB_OUTPUT"
      - name: Verify exact successful Mercury run and handoff artifact
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.handoff_artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.handoff_artifact_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.mercury_run_attempt }}
          EXPECTED_RUN_ID: ${{ inputs.mercury_run_id }}
          GH_TOKEN: ${{ secrets.MERCURY_TARGET_REPOSITORY_READ_TOKEN }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          RUN_METADATA="$RUNNER_TEMP/mercury-run.json"
          gh api "repos/$TARGET_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" \
            >"$RUN_METADATA"
          jq -e \
            --arg head_sha "$REVIEWED_SHA" \
            --argjson run_attempt "$EXPECTED_RUN_ATTEMPT" \
            '(.head_sha == $head_sha) and (.run_attempt == $run_attempt) and
             (.head_branch == "main") and (.event == "workflow_dispatch") and
             (.conclusion == "success") and
             (.path == ".github/workflows/release.yml")' \
            "$RUN_METADATA" >/dev/null
          ARTIFACT_METADATA="$RUNNER_TEMP/release-ready-artifact.json"
          gh api \
            "repos/$TARGET_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" \
            >"$ARTIFACT_METADATA"
          jq -e \
            --argjson artifact_id "$EXPECTED_ARTIFACT_ID" \
            --argjson run_id "$EXPECTED_RUN_ID" \
            --arg name "mercury-v0.2.1-release-ready-$EXPECTED_RUN_ID-attempt-$EXPECTED_RUN_ATTEMPT" \
            --arg digest "sha256:$EXPECTED_ARTIFACT_DIGEST" \
            '(.id == $artifact_id) and (.workflow_run.id == $run_id) and
             (.name == $name) and (.digest == $digest) and (.expired == false)' \
            "$ARTIFACT_METADATA" >/dev/null
      - name: Download exact release-ready handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.handoff_artifact_id }}
          github-token: ${{ secrets.MERCURY_TARGET_REPOSITORY_READ_TOKEN }}
          merge-multiple: true
          repository: ${{ steps.target.outputs.repository }}
          run-id: ${{ inputs.mercury_run_id }}
          path: ${{ runner.temp }}/release-ready
      - name: Verify strict release-ready payload
        id: handoff
        env:
          CONTROL_RUN_ATTEMPT: ${{ inputs.control_run_attempt }}
          CONTROL_RUN_ID: ${{ inputs.control_run_id }}
          EXPECTED_PAYLOAD_SHA256: ${{ inputs.handoff_payload_sha256 }}
          MERCURY_RUN_ATTEMPT: ${{ inputs.mercury_run_attempt }}
          MERCURY_RUN_ID: ${{ inputs.mercury_run_id }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/release-ready/mercury-v0.2.1-release-ready.json"
          test -f "$HANDOFF"
          test ! -L "$HANDOFF"
          test "$(find "$RUNNER_TEMP/release-ready" -type f | wc -l | tr -d ' ')" = "1"
          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA256" "$HANDOFF" | sha256sum --check
          python3 scripts/verify_mercury_handoff.py \
            --handoff "$HANDOFF" \
            --reviewed-sha "$REVIEWED_SHA" \
            --caller-run-id "$MERCURY_RUN_ID" \
            --caller-run-attempt "$MERCURY_RUN_ATTEMPT" \
            --control-run-id "$CONTROL_RUN_ID" \
            --control-run-attempt "$CONTROL_RUN_ATTEMPT" \
            --control-repository "$GITHUB_REPOSITORY" \
            --control-repository-id "$GITHUB_REPOSITORY_ID" \
            --control-producer-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/verified-handoff.json"
          echo "source_run_id=$(jq -r '.original_release_control.run_id' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "source_run_attempt=$(jq -r '.original_release_control.run_attempt' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "source_artifact_id=$(jq -r '.original_release_control.artifact_id' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "source_artifact_digest=$(jq -r '.original_release_control.artifact_digest' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "source_payload_sha256=$(jq -r '.original_release_control.payload_sha256' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "source_staging_ref=$(jq -r '.original_release_control.staging_ref' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "release_artifact_id=$(jq -r '.release_artifacts.artifact_id' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "relay_artifact_id=$(jq -r '.relayed_attestation.artifact_id' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
          echo "staging_artifact_id=$(jq -r '.staging_identity.artifact_id' "$RUNNER_TEMP/verified-handoff.json")" >>"$GITHUB_OUTPUT"
      - name: Verify original release-control run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.handoff.outputs.source_artifact_digest }}
          SOURCE_ARTIFACT_ID: ${{ steps.handoff.outputs.source_artifact_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.handoff.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ steps.handoff.outputs.source_run_id }}
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/verified-handoff.json"
          SOURCE_REPOSITORY="$(jq -r '.original_release_control.repository' "$HANDOFF")"
          SOURCE_REPOSITORY_ID="$(jq -r '.original_release_control.repository_id' "$HANDOFF")"
          SOURCE_PRODUCER_SHA="$(jq -r '.original_release_control.producer_commit_sha' "$HANDOFF")"
          SOURCE_WORKFLOW_PATH="$(jq -r '.original_release_control.workflow_path' "$HANDOFF")"
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_REPOSITORY_ID" = "$GITHUB_REPOSITORY_ID"
          test "$SOURCE_PRODUCER_SHA" = "$GITHUB_SHA"
          test "$SOURCE_WORKFLOW_PATH" = ".github/workflows/attest-v0.2.1.yml"
          RUN_METADATA="$RUNNER_TEMP/source-control-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            >"$RUN_METADATA"
          jq -e \
            --arg head_sha "$SOURCE_PRODUCER_SHA" \
            --arg workflow_path "$SOURCE_WORKFLOW_PATH" \
            --argjson run_attempt "$SOURCE_RUN_ATTEMPT" \
            '(.head_sha == $head_sha) and (.run_attempt == $run_attempt) and
             (.head_branch == "main") and (.event == "workflow_dispatch") and
             (.conclusion == "success") and (.path == $workflow_path)' \
            "$RUN_METADATA" >/dev/null
          ARTIFACT_METADATA="$RUNNER_TEMP/source-control-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            >"$ARTIFACT_METADATA"
          jq -e \
            --argjson artifact_id "$SOURCE_ARTIFACT_ID" \
            --argjson run_id "$SOURCE_RUN_ID" \
            --arg name "mercury-v0.2.1-trusted-attestation-run-$SOURCE_RUN_ID-attempt-$SOURCE_RUN_ATTEMPT" \
            --arg digest "sha256:$SOURCE_ARTIFACT_DIGEST" \
            '(.id == $artifact_id) and (.workflow_run.id == $run_id) and
             (.name == $name) and (.digest == $digest) and (.expired == false)' \
            "$ARTIFACT_METADATA" >/dev/null
      - name: Download original release-control attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.handoff.outputs.source_artifact_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ steps.handoff.outputs.source_run_id }}
          path: ${{ runner.temp }}/original-release-control
      - name: Strictly verify original release-control attestation
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
          SOURCE_PAYLOAD_SHA256: ${{ steps.handoff.outputs.source_payload_sha256 }}
          SOURCE_RUN_ATTEMPT: ${{ steps.handoff.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ steps.handoff.outputs.source_run_id }}
          SOURCE_STAGING_REF: ${{ steps.handoff.outputs.source_staging_ref }}
        run: |
          set -euo pipefail
          ATTESTATION="$RUNNER_TEMP/original-release-control/trusted-hosted-attestation.json"
          test -f "$ATTESTATION"
          test ! -L "$ATTESTATION"
          test "$(find "$RUNNER_TEMP/original-release-control" -type f | wc -l | tr -d ' ')" = "1"
          python3 scripts/verify_original_attestation.py \
            --attestation "$ATTESTATION" \
            --policy policy-v0.2.1.json \
            --payload-sha256 "$SOURCE_PAYLOAD_SHA256" \
            --reviewed-sha "$REVIEWED_SHA" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --producer-sha "$GITHUB_SHA" \
            --producer-run-id "$SOURCE_RUN_ID" \
            --producer-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --staging-ref "$SOURCE_STAGING_REF"
      - name: Verify exact Mercury artifact metadata
        env:
          GH_TOKEN: ${{ secrets.MERCURY_TARGET_REPOSITORY_READ_TOKEN }}
          MERCURY_RUN_ATTEMPT: ${{ inputs.mercury_run_attempt }}
          MERCURY_RUN_ID: ${{ inputs.mercury_run_id }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/verified-handoff.json"
          verify_artifact() {
            local section="$1"
            local artifact_id digest expected_name metadata
            artifact_id="$(jq -r ".$section.artifact_id" "$HANDOFF")"
            digest="$(jq -r ".$section.artifact_digest" "$HANDOFF")"
            expected_name="$2"
            metadata="$RUNNER_TEMP/$section-artifact.json"
            gh api "repos/$TARGET_REPOSITORY/actions/artifacts/$artifact_id" >"$metadata"
            jq -e \
              --argjson artifact_id "$artifact_id" \
              --argjson run_id "$MERCURY_RUN_ID" \
              --arg name "$expected_name" \
              --arg digest "sha256:$digest" \
              '(.id == $artifact_id) and (.workflow_run.id == $run_id) and
               (.name == $name) and (.digest == $digest) and (.expired == false)' \
              "$metadata" >/dev/null
          }
          verify_artifact release_artifacts \
            "mercury-v0.2.1-release-artifacts-$MERCURY_RUN_ID-attempt-$MERCURY_RUN_ATTEMPT"
          verify_artifact staging_identity \
            "mercury-v0.2.1-public-staging-identity-$MERCURY_RUN_ID-attempt-$MERCURY_RUN_ATTEMPT"
          verify_artifact relayed_attestation \
            "mercury-v0.2.1-trusted-attestation-$MERCURY_RUN_ID-attempt-$MERCURY_RUN_ATTEMPT"
      - name: Download exact verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.handoff.outputs.release_artifact_id }}
          github-token: ${{ secrets.MERCURY_TARGET_REPOSITORY_READ_TOKEN }}
          merge-multiple: true
          repository: ${{ steps.target.outputs.repository }}
          run-id: ${{ inputs.mercury_run_id }}
          path: ${{ runner.temp }}/release-artifacts
      - name: Independently fetch exact reviewed Git source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ inputs.reviewed_commit_sha }}
          token: ${{ secrets.MERCURY_TARGET_REPOSITORY_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-reviewed-source
      - name: Materialize canonical source from reviewed Git objects
        id: source
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          SOURCE_REPOSITORY="$GITHUB_WORKSPACE/trusted-reviewed-source"
          CANONICAL_SOURCE="$RUNNER_TEMP/trusted-canonical-source"
          test "$(git -C "$SOURCE_REPOSITORY" rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(git -C "$SOURCE_REPOSITORY" remote get-url origin)" = \
            "https://github.com/$TARGET_REPOSITORY"
          git -C "$SOURCE_REPOSITORY" cat-file -e "$REVIEWED_SHA^{commit}"
          PREPARE_RESULT="$RUNNER_TEMP/trusted-source-result.json"
          python3 scripts/verify_release_assets.py prepare-source \
            --source-repository "$SOURCE_REPOSITORY" \
            --canonical-source "$CANONICAL_SOURCE" \
            --reviewed-sha "$REVIEWED_SHA" \
            --version 0.2.1 >"$PREPARE_RESULT"
          jq -e \
            '(.status == "ok") and (.files > 0) and (.bytes > 0) and
             (.source_date_epoch >= 315532800) and
             (.source_date_epoch <= 4102444800)' \
            "$PREPARE_RESULT" >/dev/null
          echo "source_date_epoch=$(jq -r '.source_date_epoch' "$PREPARE_RESULT")" \
            >>"$GITHUB_OUTPUT"
      - name: Acquire pinned build dependencies without candidate input
        run: |
          set -euo pipefail
          BUILDER_IMAGE="docker.io/library/python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db"
          UV_SOURCE_IMAGE="ghcr.io/astral-sh/uv@sha256:6b6fa841d71a48fbc9e2c55651c5ad570e01104d7a7d701f57b2b22c0f58e9b1"
          UV_SHA256="f05934ddce884a121981d94c16f274a12bfc7829e48943a7f9455bb255b0be40"
          SETUPTOOLS_SHA256="062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922"
          WHEEL_SHA256="708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248"
          CONSTRAINTS_SHA256="83f111e093bad00e18d8ee645a55359e4a3b9ea26a1b2d8b91776712a0db30fb"
          TRUSTED_DEPENDENCIES="$RUNNER_TEMP/trusted-build-dependencies"
          test ! -e "$TRUSTED_DEPENDENCIES"
          install -d -m 700 "$TRUSTED_DEPENDENCIES/wheelhouse"

          UV_CONTAINER=""
          cleanup_uv_container() {
            if [[ -n "$UV_CONTAINER" ]]; then
              docker rm --force "$UV_CONTAINER" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_uv_container EXIT
          UV_CONTAINER="$(docker create --platform linux/amd64 "$UV_SOURCE_IMAGE")"
          docker cp "$UV_CONTAINER:/uv" "$TRUSTED_DEPENDENCIES/uv"
          docker rm "$UV_CONTAINER" >/dev/null
          UV_CONTAINER=""

          docker run --rm --interactive --platform linux/amd64 \
            --network bridge --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=134217728 \
            --volume "$TRUSTED_DEPENDENCIES/wheelhouse:/trusted-wheelhouse:rw" \
            "$BUILDER_IMAGE" python3 - <<'PY'
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          downloads = (
              (
                  "https://files.pythonhosted.org/packages/a3/dc/17031897dae0efacfea57dfd3a82fdd2a2aeb58e0ff71b77b87e44edc772/setuptools-80.9.0-py3-none-any.whl",
                  "setuptools-80.9.0-py3-none-any.whl",
                  "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922",
                  1201486,
              ),
              (
                  "https://files.pythonhosted.org/packages/0b/2c/87f3254fd8ffd29e4c02732eee68a83a1d3c346ae39bc6822dcbcb697f2b/wheel-0.45.1-py3-none-any.whl",
                  "wheel-0.45.1-py3-none-any.whl",
                  "708e7481cc80179af0e556bbf0cc00b8444c7321e2700b8d8580231d13017248",
                  72494,
              ),
          )
          root = Path("/trusted-wheelhouse")
          for url, name, expected_digest, expected_size in downloads:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "mercury-release-control/0.2.1"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.geturl() != url:
                      raise SystemExit("dependency redirect rejected")
                  payload = response.read(expected_size + 1)
              if len(payload) != expected_size:
                  raise SystemExit("dependency size mismatch")
              if hashlib.sha256(payload).hexdigest() != expected_digest:
                  raise SystemExit("dependency digest mismatch")
              destination = root / name
              with destination.open("xb") as stream:
                  stream.write(payload)
              os.chmod(destination, 0o444)
          PY

          printf '%s  %s\n' "$UV_SHA256" \
            "$TRUSTED_DEPENDENCIES/uv" | sha256sum --check
          printf '%s  %s\n' "$SETUPTOOLS_SHA256" \
            "$TRUSTED_DEPENDENCIES/wheelhouse/setuptools-80.9.0-py3-none-any.whl" \
            | sha256sum --check
          printf '%s  %s\n' "$WHEEL_SHA256" \
            "$TRUSTED_DEPENDENCIES/wheelhouse/wheel-0.45.1-py3-none-any.whl" \
            | sha256sum --check
          printf '%s\n' \
            "setuptools==80.9.0 --hash=sha256:$SETUPTOOLS_SHA256" \
            "wheel==0.45.1 --hash=sha256:$WHEEL_SHA256" \
            >"$TRUSTED_DEPENDENCIES/build-constraints.txt"
          printf '%s  %s\n' "$CONSTRAINTS_SHA256" \
            "$TRUSTED_DEPENDENCIES/build-constraints.txt" | sha256sum --check
          test "$(find "$TRUSTED_DEPENDENCIES" -type f | wc -l | tr -d ' ')" = "4"
          test "$(find "$TRUSTED_DEPENDENCIES" -type l | wc -l | tr -d ' ')" = "0"
          while IFS= read -r dependency; do
            test -f "$dependency"
            test "$(stat -c '%h' "$dependency")" = "1"
            test "$(stat -c '%s' "$dependency")" -le 67108864
          done < <(find "$TRUSTED_DEPENDENCIES" -type f -print)
          chmod 0555 "$TRUSTED_DEPENDENCIES/uv"
          chmod 0444 "$TRUSTED_DEPENDENCIES/build-constraints.txt"
          chmod 0555 "$TRUSTED_DEPENDENCIES" "$TRUSTED_DEPENDENCIES/wheelhouse"
      - name: Reproduce wheel and sdist in networkless isolation
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          BUILDER_IMAGE="docker.io/library/python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db"
          SOURCE_ROOT="$RUNNER_TEMP/trusted-canonical-source"
          TRUSTED_DEPENDENCIES="$RUNNER_TEMP/trusted-build-dependencies"
          REPRODUCED_DISTRIBUTIONS="$RUNNER_TEMP/trusted-reproduced-distributions"
          test ! -e "$REPRODUCED_DISTRIBUTIONS"
          install -d -m 700 "$REPRODUCED_DISTRIBUTIONS"
          sudo mount -t tmpfs \
            -o "size=2147483648,nosuid,nodev,noexec,uid=$(id -u),gid=$(id -g),mode=0700" \
            tmpfs "$REPRODUCED_DISTRIBUTIONS"
          cleanup_reproduction() {
            sudo umount "$REPRODUCED_DISTRIBUTIONS" >/dev/null 2>&1 || true
            rmdir "$REPRODUCED_DISTRIBUTIONS" >/dev/null 2>&1 || true
          }
          trap cleanup_reproduction EXIT
          docker run --rm --platform linux/amd64 \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 4g --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=1073741824 \
            --volume "$SOURCE_ROOT:/trusted-source:ro" \
            --volume "$TRUSTED_DEPENDENCIES:/trusted-dependencies:ro" \
            --volume "$REPRODUCED_DISTRIBUTIONS:/reproduced-distributions:rw" \
            --workdir /trusted-source \
            --env HOME=/tmp/home \
            --env LC_ALL=C \
            --env PYTHONHASHSEED=0 \
            --env PYTHONNOUSERSITE=1 \
            --env PYTHONPATH= \
            --env SOURCE_DATE_EPOCH \
            --env TMPDIR=/tmp \
            --env UV_CACHE_DIR=/tmp/uv-cache \
            --env UV_NO_CONFIG=1 \
            --env UV_NO_INDEX=1 \
            --env UV_NO_PROGRESS=1 \
            --env UV_OFFLINE=1 \
            --env UV_PYTHON=/usr/local/bin/python3.12 \
            --env UV_PYTHON_DOWNLOADS=never \
            --env UV_REQUIRE_HASHES=1 \
            "$BUILDER_IMAGE" sh -ceu '
              printf "%s  %s\n" \
                f05934ddce884a121981d94c16f274a12bfc7829e48943a7f9455bb255b0be40 \
                /trusted-dependencies/uv | sha256sum --check
              /trusted-dependencies/uv build \
                --wheel --sdist \
                --out-dir /reproduced-distributions \
                --offline --no-config --no-index --no-sources \
                --no-python-downloads --require-hashes \
                --build-constraints /trusted-dependencies/build-constraints.txt \
                --find-links /trusted-dependencies/wheelhouse \
                --no-progress --color never \
                /trusted-source
            '
          trap - EXIT
      - name: Compare candidate assets to independent reproduction
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          set -euo pipefail
          REPRODUCED_DISTRIBUTIONS="$RUNNER_TEMP/trusted-reproduced-distributions"
          cleanup_reproduction() {
            sudo umount "$REPRODUCED_DISTRIBUTIONS" >/dev/null 2>&1 || true
            rmdir "$REPRODUCED_DISTRIBUTIONS" >/dev/null 2>&1 || true
          }
          trap cleanup_reproduction EXIT
          python3 scripts/verify_release_assets.py verify \
            --artifact-root "$RUNNER_TEMP/release-artifacts" \
            --source-repository "$GITHUB_WORKSPACE/trusted-reviewed-source" \
            --canonical-source "$RUNNER_TEMP/trusted-canonical-source" \
            --reproduced-distributions "$REPRODUCED_DISTRIBUTIONS" \
            --reviewed-sha "$REVIEWED_SHA" \
            --version 0.2.1
      - name: Publish exact immutable release
        env:
          GH_TOKEN: ${{ secrets.MERCURY_TARGET_REPOSITORY_TOKEN }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/release-artifacts"
          EXPECTED_ASSETS="$RUNNER_TEMP/expected-release-assets.json"
          MANIFEST_DIGEST="$(sha256sum "$ARTIFACT_ROOT/SHA256SUMS.json" | awk '{print $1}')"
          MANIFEST_SIZE="$(stat -c '%s' "$ARTIFACT_ROOT/SHA256SUMS.json")"
          jq \
            --arg manifest_digest "sha256:$MANIFEST_DIGEST" \
            --argjson manifest_size "$MANIFEST_SIZE" \
            '[.artifacts[] | {name: .file_name, size: .size,
              digest: ("sha256:" + .sha256)}] +
             [{name: "SHA256SUMS.json", size: $manifest_size,
               digest: $manifest_digest}] | sort_by(.name)' \
            "$ARTIFACT_ROOT/SHA256SUMS.json" >"$EXPECTED_ASSETS"

          verify_target_main() {
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$REVIEWED_SHA"
          }
          verify_tag_binding() {
            local tag_ref tag_object_sha tag_object
            tag_ref="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/v0.2.1")"
            test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
            tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            tag_object="$(gh api "repos/$TARGET_REPOSITORY/git/tags/$tag_object_sha")"
            test "$(jq -r '.tag' <<<"$tag_object")" = "v0.2.1"
            test "$(jq -r '.object.type' <<<"$tag_object")" = "commit"
            test "$(jq -r '.object.sha' <<<"$tag_object")" = "$REVIEWED_SHA"
          }
          verify_remote_assets() {
            local release_id="$1"
            local release_json="$RUNNER_TEMP/release-$release_id.json"
            local actual_assets="$RUNNER_TEMP/release-$release_id-assets.json"
            gh api "repos/$TARGET_REPOSITORY/releases/$release_id" >"$release_json"
            jq '[.assets[] | {name, size, digest}] | sort_by(.name)' \
              "$release_json" >"$actual_assets"
            cmp "$EXPECTED_ASSETS" "$actual_assets"
          }

          verify_target_main
          if gh api "repos/$TARGET_REPOSITORY/git/ref/tags/v0.2.1" \
            >"$RUNNER_TEMP/existing-tag.json" 2>/dev/null; then
            verify_tag_binding
          else
            TAG_OBJECT_SHA="$(jq -n \
              --arg tag "v0.2.1" \
              --arg message "Mercury Finance v0.2.1" \
              --arg object "$REVIEWED_SHA" \
              '{tag: $tag, message: $message, object: $object, type: "commit"}' \
              | gh api --method POST "repos/$TARGET_REPOSITORY/git/tags" \
                --input - --jq '.sha')"
            jq -n \
              --arg ref "refs/tags/v0.2.1" \
              --arg sha "$TAG_OBJECT_SHA" \
              '{ref: $ref, sha: $sha}' \
              | gh api --method POST "repos/$TARGET_REPOSITORY/git/refs" \
                --input - >/dev/null
            verify_tag_binding
          fi

          if RELEASE_STATE="$(gh release view v0.2.1 --repo "$TARGET_REPOSITORY" \
            --json databaseId,isDraft,isPrerelease,tagName 2>/dev/null)"; then
            RELEASE_ID="$(jq -r '.databaseId' <<<"$RELEASE_STATE")"
            test "$(jq -r '.tagName' <<<"$RELEASE_STATE")" = "v0.2.1"
            test "$(jq -r '.isPrerelease' <<<"$RELEASE_STATE")" = "false"
            verify_remote_assets "$RELEASE_ID"
            if [[ "$(jq -r '.isDraft' <<<"$RELEASE_STATE")" = "true" ]]; then
              verify_target_main
              verify_tag_binding
              gh release edit v0.2.1 --repo "$TARGET_REPOSITORY" --draft=false
            fi
          else
            gh release create v0.2.1 "$ARTIFACT_ROOT"/* \
              --repo "$TARGET_REPOSITORY" --verify-tag --draft \
              --title "Mercury Finance v0.2.1" \
              --notes-file release-notes-v0.2.1.md
            RELEASE_ID="$(gh release view v0.2.1 --repo "$TARGET_REPOSITORY" \
              --json databaseId --jq '.databaseId')"
            verify_remote_assets "$RELEASE_ID"
            verify_target_main
            verify_tag_binding
            gh release edit v0.2.1 --repo "$TARGET_REPOSITORY" --draft=false
          fi

          verify_target_main
          verify_tag_binding
          FINAL_RELEASE="$RUNNER_TEMP/final-release.json"
          gh api "repos/$TARGET_REPOSITORY/releases/$RELEASE_ID" >"$FINAL_RELEASE"
          jq -e \
            '(.tag_name == "v0.2.1") and (.draft == false) and
             (.prerelease == false) and (.immutable == true)' \
            "$FINAL_RELEASE" >/dev/null
          verify_remote_assets "$RELEASE_ID"
