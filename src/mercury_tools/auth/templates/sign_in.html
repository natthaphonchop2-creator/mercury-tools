<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Mercury</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #f5f7f8;
      color: #172126;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(32rem, calc(100% - 2rem));
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #d8e0e3;
      border-radius: 8px;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      letter-spacing: 0;
    }
    p {
      line-height: 1.5;
    }
    form {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    label {
      display: grid;
      gap: 0.4rem;
      font-weight: 700;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #829096;
      border-radius: 6px;
      padding: 0.7rem;
      font: inherit;
    }
    button {
      border: 1px solid #25614c;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      background: #25614c;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      color: #9f2f2f;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to Mercury</h1>
    <p>Continue to review access for your Mercury workspace.</p>
    $error_message
    <form method="post" action="/oauth/sign-in">
      <input type="hidden" name="authorization_id" value="$authorization_id">
      <label>
        Email
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
