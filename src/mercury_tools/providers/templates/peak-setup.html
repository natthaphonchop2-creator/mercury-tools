<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connect PEAK to Mercury</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #f5f7f8;
      color: #172126;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(34rem, calc(100% - 2rem));
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #d8e0e3;
      border-radius: 8px;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      letter-spacing: 0;
    }
    p {
      line-height: 1.5;
    }
    form, label {
      display: grid;
      gap: 0.75rem;
    }
    form {
      margin-top: 1.5rem;
    }
    label {
      gap: 0.35rem;
      font-weight: 700;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #829096;
      border-radius: 6px;
      padding: 0.7rem;
      font: inherit;
    }
    button {
      border: 1px solid #25614c;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      background: #25614c;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      color: #9f2f2f;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="setup-root" aria-live="polite">
    <h1>Connect PEAK</h1>
    <p>Preparing the secure credential form.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const setupToken = window.location.hash.slice(1);
      window.history.replaceState(null, "", window.location.pathname);
      const root = document.getElementById("setup-root");
      if (!setupToken || !root) {
        return;
      }
      fetch("/auth/providers/peak/setup/exchange", {
        method: "POST",
        credentials: "same-origin",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({setup_token: setupToken})
      }).then((response) => {
        if (!response.ok) {
          throw new Error("setup_failed");
        }
        return response.text();
      }).then((markup) => {
        root.innerHTML = markup;
      }).catch(() => {
        root.innerHTML = '<p class="error">Secure setup could not continue.</p>';
      });
    })();
  </script>
</body>
</html>
