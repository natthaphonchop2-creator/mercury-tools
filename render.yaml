services:
  - type: web
    name: mercury-tools-mcp
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: MERCURY_TOOLS_MCP_TRANSPORT
        value: streamable-http
      - key: MERCURY_TOOLS_HOST
        value: 0.0.0.0
      - key: MERCURY_TOOLS_MCP_PATH
        value: /mcp
      - key: MERCURY_TOOLS_HTTP_REQUIRE_AUTH
        value: "true"
      - key: MERCURY_V1_ENABLED
        value: "true"
      - key: MERCURY_CANONICAL_MCP_RESOURCE
        value: https://mercury-tools-mcp.onrender.com/mcp
      - key: SUPABASE_AUTH_ISSUER
        value: https://vbnlkqvauqwnjbxngkas.supabase.co/auth/v1
      - key: SUPABASE_JWKS_URL
        value: https://vbnlkqvauqwnjbxngkas.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_AUDIENCE
        value: https://mercury-tools-mcp.onrender.com/mcp
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: MERCURY_VAULT_ACTIVE_KEY
        sync: false
      - key: MERCURY_VAULT_ACTIVE_KEY_VERSION
        sync: false
      - key: MERCURY_VAULT_PREVIOUS_KEY
        sync: false
      - key: MERCURY_VAULT_PREVIOUS_KEY_VERSION
        sync: false
      - key: FLOWACCOUNT_MCP_SANDBOX_URL
        value: https://mcp.flowaccount.com/mcp
      - key: FLOWACCOUNT_MCP_PRODUCTION_URL
        value: https://mcp.flowaccount.com/mcp
      - key: FLOWACCOUNT_OAUTH_SANDBOX_AUTHORIZATION_SERVER_ORIGIN
        value: https://mcp.flowaccount.com
      - key: FLOWACCOUNT_OAUTH_PRODUCTION_AUTHORIZATION_SERVER_ORIGIN
        value: https://mcp.flowaccount.com
      - key: PEAK_MCP_UAT_URL
        value: https://mcp.peakaccount.com/mcp
      - key: PEAK_MCP_PRODUCTION_URL
        value: https://mcp.peakaccount.com/mcp
      - key: PEAK_APPLICATION_CODE
        sync: false
      - key: MERCURY_PROVIDER_CALLBACK_BASE_URL
        value: https://mercury-tools-mcp.onrender.com
      - key: MERCURY_TOOLS_ENABLE_LEGACY_HTTP_API
        value: "false"
      - key: MERCURY_CONNECT_SIGNING_SECRET
        sync: false
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false
      - key: MERCURY_TOOLS_PUBLIC_BASE_URL
        value: https://mercury-tools-mcp.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MERCURY_TOOLS_EMBEDDING_PROVIDER
        value: hash
      - key: MERCURY_TOOLS_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MERCURY_TOOLS_EMBEDDING_DIM
        value: "1536"
