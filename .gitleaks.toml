title = "Mercury synthetic secret-fixture allowlists"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Mercury scanner high-entropy hex fixture"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_release_secret_scanner\.py$''']
  regexes = ['''^\s*credential\s*=\s*"[0-9a-f]{16}"\s*\*\s*8\s*$''']

  [[rules.allowlists]]
  description = "Mercury cloud purge API-key fixture"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_cloud_secret_removal\.py$''']
  regexes = ['''^\s*\{"id":\s*"event-1",\s*"summary":\s*\{"api_key":\s*"live-api-key-123456789"\},\s*"metadata":\s*\{\}\}\s*$''']

  [[rules.allowlists]]
  description = "Mercury package validation credential fixtures"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_plugin_package\.py$''']
  regexes = [
    '''^\s*\("api_key",\s*"sk-live-[0-9a-f]{24}"\),\s*$''',
    '''^\s*\("client_secret",\s*"v1\.[A-Za-z0-9]{20}"\),\s*$''',
  ]

  [[rules.allowlists]]
  description = "Mercury inbound redaction fixtures"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_cloud_api\.py$''']
  regexes = ['''^\s*for secret in \("inbound-secret",\s*"inbound-secret2",\s*"inbound-session"\):\s*$''']

  [[rules.allowlists]]
  description = "Mercury V1 boolean Render setting"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^render\.yaml$''']
  regexes = ['''^\s*- key: MERCURY_V1_ENABLED\s*$''']

  [[rules.allowlists]]
  description = "Pinned public GitHub Action commit fixture"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_aws_wave0_templates\.py$''']
  regexes = ['''^\s*(credentials_action_sha|upload_action_sha) = "[0-9a-f]{40}"\s*$''']

  [[rules.allowlists]]
  description = "Generated Python bytecode"
  paths = ['''(^|/)__pycache__/''']

[[rules]]
id = "aws-access-token"

  [[rules.allowlists]]
  description = "Mercury AWS-token redaction fixture"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_cloud_secret_removal\.py$''']
  regexes = [
    '''^\s*"aws=AKIA[0-9]{10}ABCDEF",\s*$''',
    '''^\s*"AKIA[0-9]{10}ABCDEF",\s*$''',
  ]

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "Mercury JWT redaction fixture"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^tests/test_cloud_secret_removal\.py$''']
  regexes = ['''^\s*"jwt=eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.signaturevalue1234",\s*$''']
